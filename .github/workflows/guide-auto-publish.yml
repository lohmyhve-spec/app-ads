name: guide-auto-publish

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    if: >-
      startsWith(github.head_ref, 'draft/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'lohmyhve-spec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Machine checks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, xml.dom.minidom
          base, head = os.environ['BASE'], os.environ['HEAD']
          def git(*a): return subprocess.check_output(['git', *a], text=True)
          fail = []
          files = git('diff', '--name-status', base, head).split('\n')
          files = [f.split('\t') for f in files if f.strip()]
          print('[check] changed:', files)
          pages = [p for s, p in files if s == 'A' and re.fullmatch(r'(?:(en|it|es|ja)/)?guide/[a-z0-9-]+/index\.html', p)]
          others = [p for s, p in files if p != 'sitemap.xml' and p not in pages]
          if len(files) != 2 or len(pages) != 1 or others or not any(p == 'sitemap.xml' and s == 'M' for s, p in files):
              fail.append('1) 바뀐 파일은 새 글 1개 + sitemap.xml 수정 1개여야 함')
          num = git('diff', '--numstat', base, head, '--', 'sitemap.xml').split()
          if num[:2] != ['4', '0']:
              fail.append(f'2) sitemap.xml numstat {num[:2]} != 4 0')
          if pages:
              page = pages[0]
              h = open(page, encoding='utf-8').read()
              slugpath = page[:-len('index.html')]
              url = 'https://mungworks.com/' + slugpath
              t = re.search(r'<title>(.*?) \| Mung Works</title>', h)
              og = re.search(r'<meta property="og:title" content="([^"]+)">', h)
              h1 = re.search(r'<h1>(.*?)</h1>', h)
              if not (t and og and h1 and t.group(1) == og.group(1) == h1.group(1)):
                  fail.append('3) title / og:title / h1 불일치')
              can = re.search(r'<link rel="canonical" href="([^"]+)">', h)
              ogu = re.search(r'<meta property="og:url" content="([^"]+)">', h)
              sm = open('sitemap.xml', encoding='utf-8').read()
              if not (can and ogu and can.group(1) == ogu.group(1) == url and f'<loc>{url}</loc>' in sm):
                  fail.append('4) canonical / og:url / sitemap loc 불일치')
              if '{{' in h:
                  fail.append('6) {{ 남아 있음')
              for bad in ['play.google.com', 'apps.apple.com', '@gmail', '010-']:
                  if bad in h:
                      fail.append(f'7) 금지 문자열: {bad}')
              ref = open('guide/hwp-kakao-android/index.html', encoding='utf-8').read()
              grab = lambda s: s[s.index('<style>'):s.index('</style>')]
              if grab(h) != grab(ref):
                  fail.append('8) style 블록이 기준 글과 다름')
              if '<script' in h.lower() or '<img' in h.lower():
                  fail.append('9) script/img 금지')
              for a in re.findall(r'href="([^"]+)"', h):
                  if not a.startswith('https://mungworks.com/'):
                      fail.append(f'10) 외부 링크: {a}')
          try:
              xml.dom.minidom.parse('sitemap.xml')
          except Exception as e:
              fail.append(f'5) sitemap 파싱 실패: {e}')
          if fail:
              print('[check] FAIL'); [print(' -', f) for f in fail]
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('\n'.join(['## 자동 발행 중단'] + fail))
              sys.exit(1)
          print('[check] ALL PASS')
          PY

      - name: Merge (publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "자동 발행 중단 - 기계 확인 실패. Actions 실행 기록의 요약을 확인하세요. 병합하지 않았습니다."
